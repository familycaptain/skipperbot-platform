kind: specification
id: chores.kids.list-kids
title: Asking who is in the rotation
state: live
autonomy: gated
behavior: >
  Asking who is in the rotation lists the people currently in it, each with the household
  account they are linked to and whether they get the morning round. When nobody has been added
  yet the answer says so plainly instead of coming back empty.
implements:
- apps/chores/tools.py::list_kids
- apps/chores/routes.py::api_list_kids
- apps/chores/data.py::list_kids
