kind: specification
id: chores.kids.add-kid
title: Somebody joins the rotation by picking their account
state: live
autonomy: gated
behavior: >
  A parent adds somebody to the rotation by choosing an existing household account from a list,
  not by typing a name: the list offers every account that is not already in the rotation,
  labelled by the name that account goes by, and the new person's name is taken from it. Adding
  stays unavailable until an account is chosen, and when there is no unlinked account left the
  app says to create one first. Asking Skipper can still add somebody by name alone; a request
  with neither a name nor an account is refused.
implements:
- apps/chores/data.py::eligible_member_accounts
- apps/chores/routes.py::api_eligible_members
- apps/chores/routes.py::api_create_kid
- apps/chores/ui/ChoresApp.jsx::ManageKids
tests:
- type: unit
  path: apps/chores/tests/test_add_kid_dropdown.py
  rubric: >
    The eligible list excludes accounts already in the rotation, labels and sorts by display
    name, is empty when every account is linked, and is not narrowed by people who have no
    account at all.
links: {}
notes: >
  Choosing an account rather than typing a name is what makes the check-off permission and the
  round messages work at all — an unlinked person can be assigned chores but cannot act or be
  reached.
