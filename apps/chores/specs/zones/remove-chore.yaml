kind: specification
id: chores.zones.remove-chore
title: Retiring a chore keeps its history
state: live
autonomy: gated
behavior: >
  Retiring a chore stops it coming round from that day on, while every past check-off of it
  survives and still names it in the history. Retiring something that is not there is reported
  as not found.
implements:
- apps/chores/tools.py::remove_chore
- apps/chores/data.py::soft_delete_chore
tests: []
links: {}
notes: ''
