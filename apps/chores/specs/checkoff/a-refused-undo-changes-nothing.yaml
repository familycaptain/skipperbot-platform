kind: specification
id: chores.checkoff.a-refused-undo-changes-nothing
title: A refused undo leaves the record intact
state: live
autonomy: gated
behavior: >
  When someone who is not allowed tries to un-check a chore, the check-off survives exactly as
  it was — the same record, the same time, the same person credited — and they are told they may
  only undo their own.
implements:
- apps/chores/routes.py::api_uncomplete
tests: []
links: {}
notes: >
  Stated explicitly because the obvious implementation — remove first, ask afterwards — cannot
  honour it.
