kind: specification
id: chores.checkoff.a-parent-can-act-for-anyone
title: A parent can check off for anyone
state: live
autonomy: gated
behavior: >
  A parent or an admin can check off and un-check any person's chore. The record keeps who
  actually did the ticking, separately from whose chore it was, so acting on someone's behalf is
  always distinguishable from them doing it themselves.
implements:
- apps/chores/routes.py::_can_act_on_kid
- apps/chores/store.py::complete_chore
- apps/chores/data.py::upsert_completion
tests: []
links: {}
notes: ''
