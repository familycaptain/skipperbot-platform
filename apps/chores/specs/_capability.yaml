kind: capability
id: chores
title: Chores
app: chores
scope: >
  The household's recurring, unpaid chore rotation: an area of the house ("zone") carries a fixed set
  of weekly chores and an ordered list of the people who take turns at them, and Chores works out who
  owes what on any given day, nudges them morning and evening, and takes their check-off. Owns the
  rotation rule, the check-off record and the completion history. NOT one-off paid tasks (Bounties
  owns money and payouts) and NOT general task management (Todo).
state: live
autonomy: gated
