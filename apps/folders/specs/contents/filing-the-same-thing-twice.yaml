kind: specification
id: folders.contents.filing-the-same-thing-twice
title: Filing the same thing twice leaves one entry
state: live
autonomy: gated
behavior: >
  Adding an item a folder already holds is accepted without complaint and leaves exactly one entry
  — a folder never shows the same thing twice — so re-filing is safe to repeat and a double-click
  cannot duplicate a row.
implements:
- apps/folders/data.py::add_item
- apps/folders/store.py::add_item
- apps/folders/tools.py::add_to_folder
tests: []
links: {}
notes: ''
