kind: specification
id: folders.lifecycle.confirm-before-deleting
title: Deleting asks first, and says what is kept
state: live
autonomy: gated
behavior: >
  Deleting a folder from the app asks for confirmation first, names the folder, and says in the
  prompt that its contents are preserved — so nobody deletes a folder believing the documents in
  it go too. Declining leaves everything as it was.
implements:
- apps/folders/ui/FolderDetailApp.jsx
