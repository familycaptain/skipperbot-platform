kind: capability
id: folders
title: Folders
app: folders
scope: >
  Named, nestable folders that group things from anywhere on the platform — documents,
  attachments, anything with an id — into one place, plus the reading pass that turns whatever is
  filed into facts Skipper can answer from later. A folder holds references, not copies: the
  owning app still owns the item. NOT the items themselves (Documents owns documents) and NOT an
  access-control boundary — Folders organises and indexes.
state: live
autonomy: gated
