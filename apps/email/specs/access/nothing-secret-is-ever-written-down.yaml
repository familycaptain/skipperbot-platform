kind: specification
id: email.access.nothing-secret-is-ever-written-down
title: What is written about an access failure names no secrets
state: live
autonomy: gated
behavior: >
  The record of an access failure says what kind of failure it was and nothing else — never the
  stored permission, never a token, never any part of a message. The request to reconnect
  carries no secret either. Somebody reading Skipper's logs to work out why triage stopped
  learns why, and learns nothing that would let them into the mailbox.
implements:
- apps/email/gmail_client.py::_execute_with_reauth
- apps/email/runner.py::_notify_reauth_needed
tests:
- type: unit
  path: apps/email/tests/test_gmail_service_cache_selfheal.py
  rubric: >
    With Google's client, credentials and the notification shim all stubbed and no real tokens:
    a refused call is retried exactly once against freshly re-established access and succeeds; a
    second refusal raises without looping and asks the owner to reconnect exactly once; an error
    that is not a refusal is passed straight through untouched; and no token material appears in
    anything written to the log.
links: {}
notes: ''
