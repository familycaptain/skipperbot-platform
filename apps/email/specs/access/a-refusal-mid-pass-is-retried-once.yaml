kind: specification
id: email.access.a-refusal-mid-pass-is-retried-once
title: A refusal in the middle of a pass gets one clean retry
state: live
autonomy: gated
behavior: >
  When Google refuses partway through a pass, Skipper throws away the connection it was holding,
  establishes access again from scratch, and retries that one operation exactly once. If the
  retry works the pass carries on as though nothing happened, so a momentarily stale permission
  does not cost the household a pass. A failure that is not about access is not retried and is
  passed straight through, so real problems are not hidden behind a retry.
implements:
- apps/email/gmail_client.py::_execute_with_reauth
- apps/email/gmail_client.py::_is_auth_error
- apps/email/gmail_client.py::invalidate_service
tests:
- type: unit
  path: tests/evolve/email/test_gmail_service_cache_selfheal.py
  rubric: >
    With Google's client, credentials and the notification shim all stubbed and no real tokens:
    a refused call is retried exactly once against freshly re-established access and succeeds; a
    second refusal raises without looping and asks the owner to reconnect exactly once; an error
    that is not a refusal is passed straight through untouched; and no token material appears in
    anything written to the log.
links: {}
notes: ''
