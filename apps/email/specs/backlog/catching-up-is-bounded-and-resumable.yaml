kind: specification
id: email.backlog.catching-up-is-bounded-and-resumable
title: Catching up is spread over passes and survives a restart
state: live
autonomy: gated
behavior: >
  A catch-up works through a bounded portion of the backlog each pass and remembers where it got
  to, so a long history is drained over several passes instead of one pass running for minutes,
  and a restart or a cancellation in the middle resumes where it stopped rather than starting
  again. The rules are only recorded as caught up once the whole backlog has actually been
  worked through.
implements:
- apps/email/runner.py::_reprocess_unmatched
- apps/email/migrations/002_reeval_watermark.sql
tests:
- type: unit
  path: tests/evolve/email/test_reeval_on_rules_change.py
  rubric: >
    Driving the catch-up path with the data layer stubbed: unchanged rules read no history and
    make no calls to Google; a rule change drains the backlog exactly once and then goes quiet;
    an edit or an enable re-triggers, a delete does not; a backlog larger than one pass drains
    over several passes, newest first, over the set frozen when catch-up began, and terminates;
    a rule changed mid-catch-up gets its own later catch-up.
links: {}
notes: ''
