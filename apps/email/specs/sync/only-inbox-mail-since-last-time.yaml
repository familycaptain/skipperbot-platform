kind: specification
id: email.sync.only-inbox-mail-since-last-time
title: Each pass looks only at inbox mail that is new to it
state: live
autonomy: gated
behavior: >
  A pass asks the mailbox only for messages that are in the inbox and arrived since that
  mailbox's last completed pass, so mail the household has already filed by hand is left alone
  and the same ground is not covered twice. A mailbox that has never completed a pass starts
  from what is in its inbox now.
implements:
- apps/email/runner.py::_process_account
- apps/email/gmail_client.py::fetch_new_messages
tests: []
links: {}
notes: ''
