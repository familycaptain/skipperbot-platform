kind: specification
id: email.accounts.the-household-supplies-its-own-google-credentials
title: Connecting needs the household's own Google credentials
state: live
autonomy: gated
behavior: >
  Because every install is somebody's own, the household supplies its own Google sign-in
  credentials and its own return address before any mailbox can be connected; there is no shared
  Skipper account and no credentials baked into the software. Until they are supplied, starting
  a connection ends at a Google error page and no mailbox is added.
implements:
- apps/email/manifest.yaml
- apps/email/gmail_client.py::_client_config
- apps/email/gmail_client.py::_redirect_uri
tests: []
links: {}
notes: ''
