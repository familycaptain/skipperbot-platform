kind: specification
id: jobs.empty-state.explanatory-hero
title: An app that has never run anything explains itself
state: live
autonomy: gated
behavior: >
  A Jobs app with no work in it at all explains what it is for — its name, its icon and a sentence
  about the background work that will appear here — instead of a bare "no jobs found". It offers
  nothing to create: work arrives from Skipper and from other apps, so there is nothing for a person
  to add by hand here.
implements:
- apps/jobs/ui/JobsApp.jsx
- apps/jobs/ui/index.js
- web/src/apps/emptyStateHero.js
tests: []
issues:
- 52
links: {}
notes: >
  Informational rather than a call to action, because nobody creates a job here directly. The wording
  of the blurb is the operator's.
