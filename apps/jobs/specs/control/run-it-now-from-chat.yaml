kind: specification
id: jobs.control.run-it-now-from-chat
title: Run it now and see the output
state: live
autonomy: gated
behavior: >
  Asked to run a shell-style job now, Skipper runs its command immediately rather than queueing it,
  and answers with the return code and the output. The run is recorded against the job as a success
  or a failure like any other and the usual message about the outcome goes out. A command still
  running after five minutes is stopped and recorded as having failed by timing out.
implements:
- apps/jobs/tools.py::run_job
- apps/jobs/store.py::record_run
tests: []
links: {}
notes: >
  Immediate rather than queued because someone asking "run the backup now" expects the output in the
  reply, not an identifier to check back on later.
