kind: specification
id: jobs.submitting.runs-once-never-recurs
title: A job runs once, never on a cadence
state: live
autonomy: gated
behavior: >
  Work handed to the queue runs exactly once. Asking for it to recur — passing a schedule or a cron
  expression when creating or updating one — does not make it recurring: the work is still created,
  the recurrence is ignored, and the answer says so plainly and points at the Schedules app as the
  way to run something on a cadence. Recurrence cannot be expressed on a job at all, so nobody is
  left believing they set up a nightly task that will never fire.
implements:
- apps/jobs/tools.py::create_job
- apps/jobs/tools.py::update_job
- apps/jobs/dispatcher.py::submit_job
- apps/jobs/migrations/003_drop_schedule_expr.sql
tests:
- type: unit
  path: tests/evolve/jobs/test_no_self_schedule.py
  rubric: >
    Offline static gate: neither the submit path nor the create path accepts or stores a recurrence
    expression, the migration that drops the column is present, and the create tool's own
    description states that a job runs once and cannot self-schedule.
links: {}
notes: >
  A recurrence field that was stored but never read let several apps believe they had scheduled
  recurring work that silently never fired. Removing the field rather than honouring it was the
  operator's call: one place owns recurrence.
