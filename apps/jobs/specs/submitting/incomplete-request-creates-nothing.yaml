kind: specification
id: jobs.submitting.incomplete-request-creates-nothing
title: An incomplete request creates nothing
state: live
autonomy: gated
behavior: >
  Asking Skipper to create a job without a name, without anything to run, or without saying who is
  asking is refused and the answer names the missing piece — no half-formed job is left waiting in
  the queue. Anything else that goes wrong while creating it is reported as an error rather than
  answered as a success.
implements:
- apps/jobs/tools.py::create_job
tests: []
links: {}
notes: ''
