id: bounties.payouts.a-minimum-before-cashing-out
title: A minimum before cashing out
state: live
autonomy: gated
behavior: >
  A household can set a minimum balance before any payout may be recorded, and while somebody is
  under it every attempt for them is refused naming both their balance and the threshold, so small
  amounts accumulate instead of being paid out in dribs. A parent can raise, lower or effectively
  remove the minimum in the app's settings.
