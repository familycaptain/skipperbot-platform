kind: specification
id: bounties.payouts.a-payout-lowers-the-balance
title: A payout lowers the balance
state: live
autonomy: gated
behavior: >
  Recording a payout reduces the recipient's balance by the amount paid and adds it to their
  lifetime payouts, leaving their lifetime earnings untouched. How they were paid is recorded
  alongside it, and the balance they are left with is reported back immediately.
implements:
- apps/bounties/store.py::record_payment
- apps/bounties/data.py::debit_payment
- apps/bounties/ui/BountiesApp.jsx::RecordPaymentForm
tests: []
links: {}
notes: ''
