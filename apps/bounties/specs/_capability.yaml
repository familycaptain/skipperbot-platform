scope: 'Paid tasks and what they are worth: a parent posts a task with a dollar value, a household
  member claims it as done, a parent approves or rejects that claim, and approval credits the
  claimant a balance the household later settles for real. Owns the shared board, the
  claim-and-review flow, per-person balances, the payout ledger and the standings. NOT the unpaid
  recurring chore rotation (the Chores app), and not a payment rail — money moves outside Skipper
  and is written down here afterwards.'
