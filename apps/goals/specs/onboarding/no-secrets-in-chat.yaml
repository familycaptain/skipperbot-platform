kind: specification
id: goals.onboarding.no-secrets-in-chat
title: Skipper never asks for a key or token in conversation
state: live
autonomy: gated
behavior: >
  Whenever setup touches something that needs a credential, Skipper points at the settings screen
  where it is entered and never invites it to be typed into the conversation — so no token,
  password or key is ever spoken into the chat log.
implements:
- apps/goals/onboarding.py::_SECRETS_NOTE
