kind: specification
id: goals.views.empty-state
title: An app with nothing in it explains itself
state: live
autonomy: gated
behavior: >
  Opening goals or tasks before anything exists shows what the app is for and an immediate way to
  add the first goal, rather than an empty list. The explanation appears only when there genuinely
  is nothing — not when a filter is hiding everything.
implements:
- apps/goals/ui/GoalsApp.jsx::SummaryView
- apps/goals/ui/TasksApp.jsx::TaskListView
- apps/goals/ui/index.js
tests: []
links: {}
notes: ''
