kind: specification
id: goals.views.project-detail
title: Look at one project's tasks
state: live
autonomy: gated
behavior: >
  Asked about a project, Skipper gives its state, priority, owners, due date and check-in cadence,
  then its whole task tree: milestones with their subtasks nested under them, loose tasks grouped
  at the end, each with position, state, what it waits on and when it is due. When nagging is on
  for the project it also names the task that is actually actionable next. A project with no tasks
  says so.
implements:
- apps/goals/tools.py::get_project_detail
- apps/goals/store.py::get_project_detail
tests: []
links: {}
notes: ''
