kind: specification
id: goals.views.live-refresh
title: Changing something in conversation updates the open screen
state: live
autonomy: gated
behavior: >
  When a conversation with Skipper creates or changes a goal, project or task, an open goals or
  tasks screen reloads what it is showing on its own — the person does not have to refresh to see
  what they just asked for. A newly added task is scrolled to and briefly highlighted so it is
  obvious which one is new.
implements:
- apps/goals/ui/GoalsApp.jsx::GoalsApp
- apps/goals/ui/TasksApp.jsx::TasksApp
tests: []
links: {}
notes: ''
