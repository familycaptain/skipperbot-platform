kind: specification
id: goals.greeting.greeting-recorded-under-why
title: The record says why Skipper spoke
state: live
autonomy: gated
behavior: >
  A greeting given while setup is under way is recorded as part of setup; an ordinary welcome-back
  is recorded as conversation. So the history does not read as though setup were still running
  months after it finished.
implements:
- apps/goals/handlers.py::_greeting_turn
