kind: capability
id: timeline
title: Timeline
app: timeline
scope: >
  The household's browsable record of what happened: dated entries people write by hand — with
  photos, tags, and Markdown bodies — plus an automatic per-person line for every change any other
  app records. Owns the chronological feed and what a reader sees in it. NOT the record of
  conversation: what was said, on any surface, belongs to the console's own record, and no
  utterance is ever a timeline entry.
state: live
