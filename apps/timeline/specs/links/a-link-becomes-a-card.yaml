kind: specification
id: timeline.links.a-link-becomes-a-card
title: A shared link shows what it is
state: live
autonomy: gated
behavior: >
  When an entry's body contains a web address, a card is shown beneath the entry with the page's
  title, its description, and its image where the page publishes them, so a shared link reads as
  something recognisable rather than a bare address. Choosing the card opens that page in a new
  window.
implements:
- apps/timeline/routes.py::api_link_preview
- apps/timeline/ui/TimelineApp.jsx::LinkPreviews
tests: []
links: {}
notes: ''
