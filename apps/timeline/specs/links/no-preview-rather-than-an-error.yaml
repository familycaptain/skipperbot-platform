kind: specification
id: timeline.links.no-preview-rather-than-an-error
title: A preview never costs the entry
state: live
autonomy: gated
behavior: >
  When a page cannot be reached, is not a web page, is too slow, or offers nothing worth showing,
  the entry is displayed with no card and nothing about the failure is put in front of the reader.
  A preview is never allowed to stop the entry itself from being shown, and a card's image that
  fails to load is simply left out of the card.
implements:
- apps/timeline/routes.py::api_link_preview
- apps/timeline/ui/TimelineApp.jsx::LinkPreviews
tests: []
links: {}
notes: ''
