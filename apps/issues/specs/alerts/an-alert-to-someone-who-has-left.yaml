kind: specification
id: issues.alerts.an-alert-to-someone-who-has-left
title: An alert for someone no longer in the household is dropped
state: live
autonomy: gated
behavior: >
  When the person a report is attributed to is no longer a member of the household, the alert about it
  is simply not raised — nothing is queued for a name nobody answers to, and the change to the report
  still goes through. The report keeps the name it was filed under, so it can be handed to a current
  member if someone still wants it validated.
implements:
- apps/issues/store.py::update_issue
- apps/notifications/store.py::create_notification
tests: []
links: {}
notes: ''
