kind: specification
id: issues.alerts.the-reporter-hears-the-outcome
title: The reporter is told how their report ended
state: live
autonomy: gated
behavior: >
  When a report closes, the person who filed it is told which of their reports it was and how it
  ended — fixed, with the beginning of what was done; declined, with the reason if one was given; or
  judged a repeat of another report. So nobody has to check the tracker to learn the answer to
  something they raised. Nothing is sent for a state change that leaves the report still in progress.
implements:
- apps/issues/store.py::update_issue
- apps/issues/store.py::CLOSED_STATUSES
tests: []
links: {}
notes: ''
