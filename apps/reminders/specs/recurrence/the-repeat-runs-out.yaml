kind: specification
id: reminders.recurrence.the-repeat-runs-out
title: When there is no next occurrence the reminder retires
state: live
autonomy: gated
behavior: >
  When a repeating reminder has no occurrence left — its last date has passed, or its pattern can
  no longer be read — it goes inactive after its final nudge rather than sitting in the list as
  something that will never happen again. It stays visible among inactive reminders, so a repeat
  that has run out can be told apart from one that was cancelled.
implements:
- apps/reminders/store.py::mark_delivered
- apps/reminders/store.py::compute_next_occurrence
tests: []
links: {}
notes: ''
