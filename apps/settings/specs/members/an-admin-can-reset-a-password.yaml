kind: specification
id: settings.members.an-admin-can-reset-a-password
title: An admin can reset a password without knowing it
state: live
autonomy: gated
behavior: >-
  An admin can set a new password of at least eight characters for any member without knowing the
  old one — for someone who has forgotten theirs or never had one. It is shown in plain text so it
  can be handed over, and the member is expected to change it once they are in.
implements:
- agent.py::api_reset_user_password
- apps/settings/ui/SettingsApp.jsx
tests: []
links: {}
notes: ''
