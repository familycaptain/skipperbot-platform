kind: specification
id: settings.account.a-first-password-has-nothing-to-prove
title: Setting a first password has nothing to prove
state: live
autonomy: gated
behavior: >-
  An account that has no password yet can have one set without supplying a current one — there is
  nothing to prove. From then on, every change requires it.
