kind: specification
id: settings.account.only-your-own-password
title: You can only change your own password
state: live
autonomy: gated
behavior: >-
  The password changed is always the signed-in person's, whoever the request names — a member cannot
  set somebody else's through the self-service form. Resetting another person's password is an admin
  action, and a separate one.
implements:
- agent.py::api_change_password
- agent.py::_actor_name
tests: []
links: {}
notes: ''
