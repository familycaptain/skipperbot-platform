kind: specification
id: settings.account.changing-your-own-password
title: Changing your own password means proving the old one
state: live
autonomy: gated
behavior: >-
  Anyone signed in can change their own password by giving the current one and a new one of at least
  eight characters. A wrong current password is refused and says so, and the password is left as it
  was.
implements:
- agent.py::api_change_password
- apps/settings/ui/SettingsApp.jsx
