kind: specification
id: settings.integrations.entering-a-credential-is-what-switches-it-on
title: Entering a credential is what switches a feature on
state: live
autonomy: gated
behavior: >-
  A feature that depends on an outside service is unavailable until its credential is stored here,
  and while it is missing anything that would have used it says so and names the page to visit rather
  than failing obscurely. Storing the credential is what makes the feature available; for most there
  is no separate enable step.
implements:
- app_platform/capabilities.py::is_enabled
- apps/settings/routes.py::api_patch_panel
tests: []
links: {}
notes: ''
