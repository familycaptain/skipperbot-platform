kind: specification
id: settings.integrations.an-empty-box-keeps-the-stored-credential
title: Leaving a credential box empty keeps the key
state: live
autonomy: gated
behavior: >-
  Because a stored credential is never sent back to the page, saving with its box empty means keep
  what is stored. Changing a neighbouring option, or turning an integration off and on again, never
  means fetching the key from the service a second time; typing a value replaces it.
implements:
- apps/settings/routes.py::api_patch_panel
- apps/settings/routes.py::api_patch_app_settings
tests: []
links: {}
notes: ''
