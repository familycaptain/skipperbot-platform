kind: specification
id: settings.integrations.a-credential-change-is-never-announced
title: Changing a credential is announced to nobody
state: live
autonomy: gated
behavior: >-
  Saving an ordinary option tells the rest of the install which option changed; saving a credential
  tells nothing and nobody. That a household has just rotated a key is not something that should appear
  in an event stream, a notification, or a chat message.
implements:
- app_platform/settings.py::set
- app_platform/config.py::set
tests: []
links: {}
notes: ''
