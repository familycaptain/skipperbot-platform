kind: specification
id: settings.integrations.a-saved-credential-is-never-readable
title: A saved credential is never readable back
state: live
autonomy: gated
behavior: >-
  Once a credential is stored, nothing can read it back out through the interface: the field comes
  back empty and all that is shown is whether something is set. A household that has lost a key obtains
  a new one from the service rather than recovering it from Skipper — and a browser session someone
  else gets hold of cannot be used to harvest the household's keys.
implements:
- apps/settings/routes.py::_panel_payload
- apps/settings/routes.py::_current_values
- apps/settings/routes.py::_panel_field_json
tests: []
links: {}
notes: ''
