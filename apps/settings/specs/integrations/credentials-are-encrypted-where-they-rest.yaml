kind: specification
id: settings.integrations.credentials-are-encrypted-where-they-rest
title: Credentials are encrypted where they are stored
state: live
autonomy: gated
behavior: >-
  A credential entered here is encrypted before it is written down, so a copy of the household's database
  — a backup, a disk, an export — yields ciphertext rather than working API keys. What decrypts them
  is not itself in the database.
implements:
- app_platform/secrets.py::encrypt
- app_platform/settings.py::set
tests: []
links: {}
notes: ''
