kind: specification
id: settings.integrations.an-unreadable-credential-is-not-fatal
title: A credential that can no longer be read is not fatal
state: live
autonomy: gated
behavior: >-
  If a stored credential cannot be decrypted — the install's encryption key was changed or lost —
  the integration that needed it simply reads as not configured, and everything else carries on. One
  unreadable key never takes Skipper down, and the fix is to paste the credential again.
implements:
- app_platform/settings.py::get
tests: []
