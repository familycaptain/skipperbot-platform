kind: specification
id: settings.household.the-debugging-switches-need-a-restart
title: The look-under-the-hood switches apply only after a restart
state: live
autonomy: gated
behavior: >-
  Two switches exist for looking under the hood — surfacing internal item ids in the interface, and
  recording model token usage in the logs — and both are read only when the server starts. Each is
  marked as needing a restart and saving one prompts for it, rather than appearing to have changed
  nothing.
implements:
- apps/settings/routes.py::PLATFORM_PANELS
- config.py::SHOW_ENTITY_IDS
tests: []
links: {}
notes: ''
