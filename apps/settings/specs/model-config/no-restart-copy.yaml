kind: specification
id: settings.model-config.no-restart-copy
title: Changing the smart or fast model needs no restart
state: live
autonomy: gated
behavior: >-
  Changing which model does the reasoning, or which does the light work, applies to the next thing
  Skipper does: the confirmation says so and no restart is asked for, because none is needed. Changing
  the text-encoding model is the one that genuinely requires a restart and everything already stored
  to be re-encoded, and it alone is still flagged that way.
implements:
- apps/settings/ui/SettingsApp.jsx
- apps/settings/routes.py::PLATFORM_PANELS
- agent.py::onboarding_save_models
tests:
- type: unit
  path: apps/settings/tests/test_model_fields_no_restart.py
issues:
- 73
links: {}
notes: >-
  The text-encoding restart is genuine — the vector dimension is fixed at first setup — so it was
  deliberately left flagged when the other two were cleared.
verified: true
