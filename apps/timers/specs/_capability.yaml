title: Timers
app: timers
scope: 'The egg timer: a countdown of a few seconds to a few minutes, started from right now,
  that announces itself when it runs out. Asked for and asked about entirely in conversation —
  no page to open. Several can run at once and be told apart by what they were set for. A timer
  lasts only as long as Skipper keeps running, and is deliberately the throwaway option: anything
  tied to a wall-clock time, anything further off than about half an hour, and anything that must
  not be lost belongs to Reminders. Recurring routines belong to Schedules.'
