kind: specification
id: timers.going-off.a-room-that-cannot-be-spoken-to
title: A speaker that has gone quiet does not move the announcement to another room
state: live
autonomy: gated
behavior: >
  When the device a timer was set on is switched off, unplugged or otherwise unreachable by the time
  the timer runs out, nothing is spoken — and the announcement is not blurted into a different room
  instead, because a countdown belongs to the place it was set. The person it belongs to still hears
  about it on their own surfaces, so the timer is not silently dropped.
implements:
- apps/timers/scheduler.py::_run_timer
- app_platform/voice/devices.py::resolve
tests: []
links: {}
notes: ''
