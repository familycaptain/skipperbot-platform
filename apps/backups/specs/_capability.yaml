scope: 'Protecting the household''s data against losing the machine: on a daily cadence, capture
  everything needed to stand Skipper up again — a copy of the database, an archive of the project
  files, and written recovery instructions — copy it to whatever off-machine destinations the
  household has enabled, keep only the most recent few, and report honestly whether last night''s
  backup actually stored anything. Owns the record of every attempt, the destinations, retention,
  and the daily did-it-run check. NOT a restore tool: recovery is a documented manual procedure
  Backups never performs itself. NOT the owner of the schedule dispatcher or of how a warning
  reaches a person.'
