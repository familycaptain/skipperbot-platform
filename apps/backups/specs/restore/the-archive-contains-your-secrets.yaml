kind: specification
id: backups.restore.the-archive-contains-your-secrets
title: The archive holds the install's secrets, and says so
state: live
autonomy: gated
behavior: >
  The file archive deliberately includes the configuration that holds the install's secrets — the
  database password and the keys the household's integrations need — because a restore without them
  produces an install that cannot start. They are stored as they are, not separately encrypted, so
  every copy of a backup is as sensitive as the running install, and the instructions travelling with
  it say plainly that the destination must be kept private.
implements:
- apps/backups/runner.py::_create_project_zip
- apps/backups/runner.py::_generate_restore_md
tests: []
links: {}
notes: >
  Stated as it is rather than as it should be: the trade-off in favour of a restorable install is
  real, but the resulting backup is an unencrypted copy of every secret the household has.
