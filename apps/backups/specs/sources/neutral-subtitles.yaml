kind: specification
id: backups.sources.neutral-subtitles
title: No install sees another household's hardware
state: live
autonomy: gated
behavior: >
  The app never names an operating system, hosting provider or machine the household did not tell it
  about — the Skipper server is described as the Skipper server and nothing more. A source that only
  exists on one household's install appears only when that household has configured it, and is
  absent everywhere else rather than shown permanently broken.
implements:
- apps/backups/ui/BackupsApp.jsx
tests: []
links: {}
notes: >
  A direct instance of the charter's "build for the masses": a hardcoded server description is
  wrong for almost every install that reads it.
