kind: specification
id: backups.destinations.destination-credentials-stay-secret
title: The destination's credentials go in and never come back out
state: live
autonomy: gated
behavior: >
  The credentials that let Skipper write to cloud storage are entered once in settings, stored
  encrypted, and never returned to any screen or caller afterwards — the app will only say whether
  they have been set. Replacing them takes effect on the next run without a restart, and credentials
  that cannot be read as valid mean that destination is passed over rather than the run failing with
  them quoted in an error.
implements:
- apps/backups/gdrive.py::_build_service
- agent.py::api_backup_config
- app_platform/backups.py::CONFIG_KEYS
tests: []
links: {}
notes: >
  Write-only credentials: the panel that sets them is not also a place they can be read back from.
