kind: specification
id: backups.runner.honest-unconfigured-run
title: A run that stored nothing never reads as success
state: live
autonomy: gated
behavior: >
  A run counts as successful only if at least one destination actually stored the copies. If a
  destination was configured and refused them, the run is recorded as failed and the reason names
  which destination refused; if there was nowhere to put them at all, it is recorded as skipped and
  says that nothing was copied off the machine, and where to configure somewhere. This holds for
  every way a backup can be asked for — the button, the daily schedule, another app — so no caller
  is ever told a backup succeeded when nothing left the machine.
implements:
- apps/backups/runner.py::_backup_status
- apps/backups/runner.py::run_backup
tests:
- type: unit
  path: tests/evolve/platform/test_backups_honest_status.py
  rubric: >
    A run reads as successful only when at least one destination stored the copies; with a
    destination refusing and none storing, it reads as failed and the reason names the destination;
    with every destination absent it reads as skipped and says nothing was copied off-machine.
issues: [86]
links: {}
notes: >
  The operator's call: honesty is decided once, centrally, rather than left to each caller to
  interpret the per-destination results for itself.
