kind: capability
id: finder
title: Finder
app: finder
scope: >
  One search box for everything in Skipper: type words, or paste a record's id, and Finder asks
  every app that owns records to search its own data, then shows the matches grouped under the app
  they came from with a way to open each one. For "where did I put that?" when the person does not
  know which app the thing lives in. NOT a store and NOT an index — Finder holds no records and no
  search history; each owning app answers for its own data.
state: live
