kind: specification
id: recipes.browsing.filter-by-category
title: Narrowing to one category
state: live
autonomy: gated
behavior: >
  Choosing a category from the bar above the collection narrows the list to the recipes carrying
  exactly that category, and choosing it again — or All — clears the filter. A category with nothing
  in it shows an empty result rather than quietly falling back to the whole collection.
implements:
- apps/recipes/data.py::filter_by_category
- apps/recipes/tools.py::list_recipes
- apps/recipes/ui/RecipeListApp.jsx
tests: []
links: {}
notes: ''
