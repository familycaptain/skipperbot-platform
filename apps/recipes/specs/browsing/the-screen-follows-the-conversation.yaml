kind: specification
id: recipes.browsing.the-screen-follows-the-conversation
title: An open recipe screen keeps up with the conversation
state: live
autonomy: gated
behavior: >
  When Skipper creates, changes or deletes a recipe or a category during a conversation, an open
  recipe browser or recipe page updates itself to match without anybody reloading the page — so what
  is on screen and what was just agreed in chat never disagree.
implements:
- chat_domain.py::RECIPE_MUTATING_TOOLS
- apps/recipes/ui/RecipeListApp.jsx
- apps/recipes/ui/RecipeDetailApp.jsx
tests: []
links: {}
notes: ''
