kind: specification
id: schedules.links.the-owner-switches-it-off
title: The owner switches it off rather than deleting it
state: live
autonomy: gated
behavior: >
  When the app that created a schedule no longer wants it — a recurring reminder cancelled, a nightly
  check turned off in settings — it pauses the schedule instead of deleting it, so nothing stops
  falling due and nothing is nagged about, while the record of what happened survives and turning the
  feature back on resumes the same schedule rather than starting a fresh one.
implements:
- apps/schedules/data.py::update_schedule
- apps/schedules/data.py::upsert_schedule
tests: []
links: {}
notes: ''
