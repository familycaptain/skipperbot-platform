kind: specification
id: schedules.identity.one-owned-check-one-schedule
title: An app's own recurring check exists exactly once
state: live
autonomy: gated
behavior: >
  When an app owns a single recurring check of its own — a nightly look at something, a periodic
  sweep — it claims that check under a name it can work out again from nothing, so setting the check
  up a second time updates the schedule that is already there instead of adding a second copy.
  Running the setup at every start-up, after a settings change, and from two callers at the same
  moment all leave exactly one schedule behind; whichever caller arrives second amends rather than
  duplicates.
implements:
- apps/schedules/data.py::upsert_schedule
- apps/schedules/migrations/001_initial.sql
tests:
- type: unit
  path: tests/evolve/meals/test_dinner_schedule.py
  rubric: >
    Repeated and simulated-concurrent set-up of an app-owned check leaves exactly one schedule keyed
    by its stable name, and the engine's own write converges on the primary key rather than
    inserting a second row.
links: {}
notes: >
  The alternative — list the schedules, look for one that matches, create it if absent — is a race
  and a scan, and it is what leaves households with two copies of the same nightly check.
