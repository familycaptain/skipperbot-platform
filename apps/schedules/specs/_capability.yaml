title: Schedules
app: schedules
scope: 'The platform''s recurring-trigger engine. Anything in the product that has to happen again
  — a household chore, a maintenance interval, a nightly check an app owns, a routine Skipper runs
  — is one schedule row here, with a cadence, an owner, a next-due time and a completion log.
  Schedules answers "when is this next due?", tells the assignee about it, and can start work when
  it arrives. NOT one-shot reminders (Reminders), NOT running the work itself (Jobs), NOT delivering
  the message (Notifications).'
