kind: specification
id: meals.deciding.malformed-filters-are-explained
title: A malformed filter is explained, not swallowed
state: live
autonomy: gated
behavior: >
  A set of filters that is not a well-formed list comes back as a plain explanation that the
  filters were unreadable, and no search is run and no results are invented.
