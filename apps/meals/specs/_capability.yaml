kind: capability
id: meals
title: Meals
app: meals
scope: >
  Deciding what to eat and remembering what was eaten: a tag-classified library of meal ideas
  built from reusable components, a log of what was actually eaten, a nightly check-in that asks
  about dinner, and a printable restaurant-style menu of the library. NOT recipes with
  ingredients and steps (the Recipes app), NOT the shopping run (Lists) — Meals is about
  choosing and remembering.
