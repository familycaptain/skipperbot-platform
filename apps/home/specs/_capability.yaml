kind: capability
id: home
title: Home
app: home
scope: >
  The household's record of the house itself: the recurring and one-off upkeep it needs, the
  problems waiting to be fixed, the appliances in it and what they are still covered for, the
  insurance over it, and the trades to call. Answers 'what's due around the house', 'when did we
  last do this', 'what's the model number', 'what are we covered for' and 'who did our roof'. NOT
  vehicle upkeep (the Auto app), medical-equipment upkeep (the Medical app), or where household
  objects are stored (the Locator app).
state: live
autonomy: gated
