kind: specification
id: home.contractors.edit-and-remove
title: Correcting or removing a contractor
state: live
autonomy: gated
behavior: >
  Editing a contractor changes only the fields supplied. Deleting asks for confirmation naming
  them and removes the record permanently; deleting one that does not exist reports not-found.
