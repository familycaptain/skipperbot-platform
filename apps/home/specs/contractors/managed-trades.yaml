kind: specification
id: home.contractors.managed-trades
title: The trades on offer are the household's own list
state: live
autonomy: gated
behavior: >
  The trades a contractor can be filed under come from a list the household controls, seeded on
  install with the common home trades so it is usable immediately, and changed from a manage
  screen that adds, renames and removes entries. Adding or renaming to a name already on the list
  is refused with a message saying so rather than failing as an error, and removing one that does
  not exist reports not-found. The same list can be managed by asking Skipper.
implements:
- apps/home/migrations/008_contractor_trades.sql
- apps/home/data.py::get_all_contractor_trades
- apps/home/data.py::contractor_trade_name_exists
- apps/home/routes.py::api_list_contractor_trades
- apps/home/routes.py::api_create_contractor_trade
- apps/home/routes.py::api_update_contractor_trade
- apps/home/routes.py::api_delete_contractor_trade
- apps/home/tools.py::list_contractor_trades
- apps/home/ui/HomeApp.jsx::TradesManager
tests:
- type: unit
  path: web/scripts/check-contractor-trades.mjs
  rubric: >
    Static prebuild guardrail: the trades table exists and is seeded idempotently with the common
    trades; the add and edit trade controls are pick-lists drawn from the managed list with no
    free-text fallback left behind; a manage screen talks to the trades API.
links: {}
notes: >
  A configurable table rather than a longer built-in list: trades vary by region and by what a
  household actually uses, and this is open-source software with many installs.
