kind: specification
id: lists.trello-boards.sync-list
title: A refresh that changes nothing writes nothing
state: live
autonomy: gated
verified: true
behavior: >
  Refreshing a linked list re-reads the board and reports what changed. A refresh that finds the
  same items — same text, same membership, same order — reports no change and leaves the list,
  including when it was last refreshed, exactly as it was: nothing is re-recorded and nothing is
  re-remembered, so a poll running every few minutes does not bury the household's memory in
  identical entries. A genuine change — an item added, removed, renamed or reordered, including a
  list genuinely emptied on the board — is saved and remembered as if someone had typed it in.
implements:
- apps/lists/tools.py::sync_list
- apps/lists/store.py::sync_from_trello
- apps/lists/store.py::_list_item_signature
tests:
- type: unit
  path: apps/lists/tests/test_sync_idempotent.py
  rubric: >
    Offline, with the board client and the persistence seams stubbed. The comparison ignores when an
    item was last touched, notices a rename, notices a reorder, and ignores crossed-off items. A
    first refresh that finds cards saves once and records the refresh time; an immediately repeated
    refresh returning the identical cards saves nothing and leaves the refresh time untouched; a
    refresh whose cards differ saves again; a refresh that genuinely returns no cards for a list
    that had some saves; and a refresh whose board read fails returns an error and saves nothing.
links: {}
notes: >
  The alternative — suppressing the remembering rather than the write — was rejected because every
  change to a list is supposed to be recallable; here there is no change.
