kind: specification
id: lists.trello-accounts.credentials-never-shown-again
title: A saved key is never readable back
state: live
autonomy: gated
behavior: >
  Once an account's key and token are saved they cannot be read back out of Skipper — all anyone
  sees is whether each is set. Saving with those boxes left blank keeps what is stored, so renaming
  nothing and correcting only the token never means fetching the key from Trello again. Typed
  credentials are masked as they are entered, with revealing them a deliberate act.
implements:
- apps/lists/trello_config.py::list_accounts
- apps/lists/trello_config.py::save_account
- apps/lists/ui/TrelloSettings.jsx::SecretInput
tests: []
links: {}
notes: ''
