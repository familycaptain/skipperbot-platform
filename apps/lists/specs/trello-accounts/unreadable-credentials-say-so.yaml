kind: specification
id: lists.trello-accounts.unreadable-credentials-say-so
title: Credentials that cannot be read say so
state: live
autonomy: gated
behavior: >
  When a stored key or token cannot be decrypted — a lost or changed encryption key — the operation
  that needed it says the credentials could not be read for that account, naming it, instead of
  behaving as though the account were simply missing or silently doing nothing.
implements:
- apps/lists/trello_config.py::get_account_creds
tests: []
links: {}
notes: ''
