kind: specification
id: lists.trello-accounts.credentials-encrypted-at-rest
title: Credentials are encrypted where they are stored
state: live
autonomy: gated
behavior: >
  An account's key and token are encrypted before being stored, so a copy of the household's
  database — a backup, a stolen disk — does not hand over the ability to act on their Trello
  account.
implements:
- apps/lists/trello_config.py::save_account
- apps/lists/trello_config.py::get_account_creds
- apps/lists/migrations/002_trello_config.sql
tests: []
links: {}
notes: ''
