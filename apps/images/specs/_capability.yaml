scope: >
  The household's one shared picture library, and the gallery that browses it. Every photo any app
  attaches to a record — a recipe, a meal, a home item, a vehicle, a timeline post, an issue
  screenshot — is a single entry here, openable full size, renamable and removable in one place.
  NOT the attaching itself (each app owns the photo strip on its own records), and NOT image
  generation.
