kind: specification
id: images.viewer.a-picture-that-is-gone
title: A picture that no longer exists says so
state: live
autonomy: gated
behavior: >
  Opening a picture that has since been deleted — a viewer tab restored from an earlier session, or a
  link to an identifier that no longer exists — says the image was not found. The same is true when
  the viewer is opened with no picture named. It never presents an empty frame, a broken-image icon,
  or a spinner that does not end.
implements:
- apps/images/ui/ImageViewer.jsx
- agent.py::api_get_image_meta
tests: []
links: {}
notes: ''
