id: weather
title: "Weather"
app: weather
state: live
autonomy: gated
scope: >
  What the weather is doing where the household lives, and what it will do next: current
  conditions, an hour-by-hour forecast, a multi-day outlook, the chance of rain over a period,
  and a radar and severe-weather map. Answerable from every surface — chat, voice, and the app
  window — and answerable about anywhere else on request, not just home. Weather owns the
  answers and how fresh they are; it does not own the household's home location (that is a
  platform setting the app reads) and it stores nothing of its own.
