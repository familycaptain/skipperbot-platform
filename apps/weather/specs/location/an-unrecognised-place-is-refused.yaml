kind: specification
id: weather.location.an-unrecognised-place-is-refused
title: "An unrecognised place is refused, not guessed at"
state: live
autonomy: gated
behavior: >
  When a named place cannot be matched, the person is told it could not be found and shown the
  forms that do work — a place name, or a postal code with a country. No weather is returned for
  a nearest or best-guess location, and the message does not read back what was typed, so a
  mistyped address is not echoed into a log everyone can see.
implements:
- apps/weather/tools.py::_resolve_place
- apps/weather/data.py::_resolve
tests: []
links: {}
notes: ''
