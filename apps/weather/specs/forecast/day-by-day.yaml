kind: specification
id: weather.forecast.day-by-day
title: "The week ahead, one line a day"
state: live
autonomy: gated
behavior: >
  Asking for the daily forecast returns one line per day with the high and low temperature, the
  condition, the chance of rain and the expected total, and the strongest wind — seven days by
  default and up to sixteen on request. A day the service does not cover is left out rather than
  shown with placeholder numbers.
implements:
- apps/weather/tools.py::get_daily_forecast
- apps/weather/tools.py::_daily_forecast_for_place
tests: []
links: {}
notes: ''
