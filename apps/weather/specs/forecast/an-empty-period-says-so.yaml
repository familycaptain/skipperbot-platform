kind: specification
id: weather.forecast.an-empty-period-says-so
title: "An empty period says so instead of showing zeros"
state: live
autonomy: gated
behavior: >
  When the service returns no forecast hours inside the period asked about, the person is told
  there is no forecast for that period. They are not shown a zero per cent chance and no rain,
  which would read as a confident 'it will be dry' when nothing was actually known.
implements:
- apps/weather/tools.py::get_rain_chance
- apps/weather/tools.py::get_hourly_forecast
- apps/weather/tools.py::get_daily_forecast
tests: []
links: {}
notes: ''
