kind: specification
id: todo.ordering.fix-the-wording-in-place
title: 'Wording can be fixed without losing the item'
state: live
autonomy: gated
behavior: >
  Double-clicking an item opens it for editing with its text selected; Enter and clicking away both
  save, Escape abandons the change. Blank text, or text identical to what was there, leaves the item
  untouched. Editing changes only the wording — never the item's place in the column, when it was
  added, or who added it.
implements:
- apps/todo/ui/TodoApp.jsx::TodoItemRow
- agent.py::api_update_list_item
tests: []
links: {}
notes: ''
