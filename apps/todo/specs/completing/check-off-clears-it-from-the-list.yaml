kind: specification
id: todo.completing.check-off-clears-it-from-the-list
title: 'Checking off clears it from the open list'
state: live
autonomy: gated
behavior: >
  Checking an item off marks it visibly done, then it leaves the open items and reappears under
  "Completed Today". It is not destroyed: the wording, who added it, and when it was completed are
  kept, so a person can see what they got through.
implements:
- apps/todo/ui/TodoApp.jsx::TodoColumn
- agent.py::api_remove_list_item
- apps/lists/store.py::remove_item
tests: []
links: {}
notes: ''
