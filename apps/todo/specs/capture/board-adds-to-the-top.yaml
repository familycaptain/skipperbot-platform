kind: specification
id: todo.capture.board-adds-to-the-top
title: 'Typed into the board, it goes on top'
state: live
autonomy: gated
behavior: >
  Typing into a column's add field and submitting puts the new item at the top of that column,
  clears the field, and leaves the cursor in it so several things can be captured one after another.
  Nothing is submitted while the field is empty or holds only spaces, and the add button only
  appears once there is something to add.
implements:
- apps/todo/ui/TodoApp.jsx::TodoColumn
- agent.py::api_add_todo_item
tests: []
links: {}
notes: ''
