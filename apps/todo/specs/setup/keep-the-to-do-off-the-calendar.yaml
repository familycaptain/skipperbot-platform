kind: specification
id: todo.setup.keep-the-to-do-off-the-calendar
title: 'The calendar entry can be switched off'
state: live
autonomy: gated
behavior: >
  A person can stop their to-do being shown on the calendar; it is shown by default, and the choice
  affects only their own entry.
