kind: specification
id: todo.setup.a-list-that-has-gone-is-replaced
title: 'A to-do list that has gone is replaced'
state: live
autonomy: gated
behavior: >
  If the list a person's to-do points at no longer exists — deleted from the Lists app, or the
  choice cleared in settings — their next visit connects a fresh empty one instead of showing an
  error or a board that never fills. The to-do side is therefore never left unset, unlike the
  backlog, which may be deliberately left empty.
implements:
- apps/todo/store.py::ensure_default_list
- apps/todo/data.py::claim_default_list
tests: []
links: {}
notes: ''
