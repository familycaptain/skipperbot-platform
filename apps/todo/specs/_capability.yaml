title: To-Do
app: todo
scope: >
  One personal to-do list per person, plus an optional backlog for what they are not acting on yet:
  capture a line, order it, check it off, and get a weekly nudge to triage. Owns each person's
  choice of which lists these are and their nudge settings; the items themselves are ordinary list
  items belonging to the Lists app, so the same items can be reached there. NOT a multi-list manager
  (Lists), NOT rotating household duties (Chores), NOT structured work with assignees and due dates
  (Goals), and NOT the ranking of what to do first (Prioritize) — To-Do is the low-ceremony capture
  surface those other apps read from.
