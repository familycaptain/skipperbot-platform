kind: specification
id: todo.weekly-nudge.on-the-day-and-time-you-chose
title: 'The nudge arrives on the day you chose, once'
state: live
autonomy: gated
behavior: >
  On the weekday a person chose, once their chosen time of day has passed, Skipper sends them their
  to-do list unprompted. It is sent at most once that day, so the repeated checking that notices it
  is due never sends it twice; and a nudge that could not go out at the chosen minute still goes out
  later the same day rather than waiting a week.
implements:
- todo_nudge_notifier.py::check_todo_nudges
- apps/reminders/scheduler.py
tests: []
links: {}
notes: ''
