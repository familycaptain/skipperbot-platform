kind: specification
id: notifications.query.filter-before-limit
title: A lookup for one source's notifications finds it
state: live
autonomy: gated
verified: true
behavior: >
  Looking up the notifications for a particular source — "the overdue notice for this schedule" —
  returns the most recent ones that actually match, even when only one result is asked for and many
  newer notifications of other kinds exist. The kind of source matches regardless of case, the source's
  id matches exactly (surrounding spaces ignored), and with no source named the answer is simply the
  most recent notifications of any kind. This is what lets a repeating job tell whether it has already
  told someone: without it, a one-result lookup answered "never told" every time, and the same overdue
  nudge went out again on every tick.
implements:
- apps/notifications/data.py::get_all_notifications
- apps/notifications/data.py::get_notifications_for_user
- apps/notifications/data.py::_source_clauses
- apps/notifications/store.py::get_notifications
tests:
- type: unit
  path: apps/notifications/tests/test_get_notifications_filter.py
  rubric: >
    Offline. PART A (lookup behaviour against a fake store, rows newest first): a one-result lookup for
    a source returns that source's own notification even when newer notifications of other kinds exist,
    and the filter reached the store rather than being applied after the limit; the reverted
    limit-then-filter order returns nothing (regression guard); the same holds when a recipient is also
    named; with no source named the most recent of any kind come back; the source kind matches
    case-insensitively in both directions. PART B (mandatory, real query text): the source conditions
    are applied before any limit, with values passed as bound parameters rather than interpolated, and
    an unfiltered lookup is unchanged.
issues:
- 43
links: {}
notes: >
  The stored query is authoritative — the duplicate in-memory filter that used to run after it was
  removed rather than kept in step. Case-insensitive on the source kind (symmetric), exact on the
  source id. Out of scope: delivery retries.
