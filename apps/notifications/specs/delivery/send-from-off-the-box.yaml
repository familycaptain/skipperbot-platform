kind: specification
id: notifications.delivery.send-from-off-the-box
title: A caretaker off the box can make Skipper tell someone something
state: live
autonomy: gated
behavior: >
  An authenticated administrator can ask Skipper, over the API, to tell one or several named people
  something and have it delivered immediately — the only route to a person that does not require
  running code on the box itself. Every recipient is checked against the household roster, and
  against having any route at all on the surfaces being asked for, before anything is recorded:
  somebody with no route to them gets no record claiming they were told. Having no route means
  EVERY requested surface is known to be dead for that person — one dead surface among several
  does not make somebody unreachable, and a surface whose state cannot be determined is never
  treated as dead. One unreachable name does NOT stop
  the others being told; the message goes to everyone it can reach and the answer names who it
  could not, and why. For each person it reports which surfaces were actually reached and what each
  one said, and reaching the web console alone does not count as having reached them. The answer
  says plainly whether every named person was reached, and cannot read as success when one was not.
  A caller may also record without delivering, and is told that is what happened.
implements:
- apps/notifications/routes.py::send_notification
tests:
- apps/notifications/tests/test_direct_send_route.py
links:
  related:
  - notifications.channels.one-channel-is-not-a-fallback
notes: >
  Written to fail loudly because it is an escalation path of last resort. Two habits of the
  surrounding code would otherwise hide a failure: create_notification answers {} for an unknown
  name and logs at debug, and _deliver_one marks a row delivered once it has TRIED, whatever came
  back — so the stored row records an attempt and is never evidence that a person was reached.

  Partial delivery over refusal is a deliberate choice and the endpoint turns on it. The failure
  that bites this path is not a typo in a hardcoded recipient list, which fails loudly on its first
  smoke test; it is DRIFT — a discord_id quietly unset months later, on a route nothing exercises
  until the emergency. Refusing the whole request would let one stale link silence the alert to the
  other people, one of whom may be the only person able to act on it. Incompleteness is therefore
  the thing that must never go unnoticed, rather than the thing that must never happen.

  It names no channel by default, taking the household's configured surfaces instead. Naming one
  would strip the others out — see notifications.channels.one-channel-is-not-a-fallback — leaving a
  recipient whose Discord copy is declined with no push route at all, which reads from outside as
  the delivery policy having dropped the message when it was this route that removed the
  alternative.
