kind: specification
id: notifications.channels.named-surface-is-not-mirroring
title: An alert addressed to a surface is not withheld like a conversation
state: live
autonomy: gated
behavior: >
  The rule that withholds a Discord copy from someone who mainly talks on the web applies to
  Skipper's side of a conversation, not to a caller that named the surface itself. A system alert
  sent to a named person on a named channel goes to that channel whether or not they have used it
  recently. Everything raised the ordinary way — reminders, timers, jobs, every app calling
  create_notification — is unaffected and still withheld exactly as before.
implements:
- apps/notifications/delivery.py::_deliver_one
- apps/notifications/routes.py::send_notification
tests:
- apps/notifications/tests/test_direct_send_route.py
links:
  related:
  - notifications.channels.discord-not-sent-half-a-conversation
notes: >
  The withholding rule is safe because the web console always receives and holds the record. That
  holds while somebody is watching the web console, which is the one thing a last-resort alert
  cannot assume: it exists for the case where nobody is. Narrowing such a message to nothing on the
  grounds that a web session has the record would drop the only copy that was going to reach a
  person.
