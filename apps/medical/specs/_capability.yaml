scope: >
  The household's health record: the people it is kept for, their medications and refill cycles,
  recurring treatments such as injections and infusions, scheduled appointments and their
  reminders, a journal of visits, procedures and emergencies, lab values over time, and medical
  equipment with its upkeep. Every record belongs to exactly one family member. NOT a diagnosis or
  clinical-advice tool, and not the homeopathy tracker (its own app) — this is a household record-
  and-reminder system holding the most sensitive data on the platform.
