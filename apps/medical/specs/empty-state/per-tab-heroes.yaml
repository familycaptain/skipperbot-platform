kind: specification
id: medical.empty-state.per-tab-heroes
title: Each empty tab explains itself
state: live
autonomy: gated
behavior: >
  A tab of the Medical app with nothing in it yet greets the person with what that tab is for and
  what to add first, written for that tab rather than for the app as a whole, so a fresh install
  explains itself six times over instead of once. A tab that is empty only because it has been
  narrowed — to one person, to one kind of event, to a single test or draw, or by hiding stopped
  records — says plainly that there is nothing matching instead, so a filtered view is never
  mistaken for a fresh install.
implements:
- apps/medical/ui/MedicalApp.jsx::PristineEmpty
- apps/medical/ui/index.js
- web/src/components/PristineEmpty.jsx
- web/src/apps/emptyStateHero.js
tests: []
links: {}
notes: >
  Per-tab wording is the operator's; the app-wide greeting was too vague to act on.
