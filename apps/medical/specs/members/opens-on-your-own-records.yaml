kind: specification
id: medical.members.opens-on-your-own-records
title: The app opens on your own records
state: live
autonomy: gated
behavior: >
  Opening Medical preselects the person whose name matches whoever is using it, so someone who is
  in the medical records lands on their own records rather than on the household's. When no person
  matches, the app opens on "All Members"; add forms still preselect a person so nothing can be
  filed against nobody.
implements:
- apps/medical/ui/MedicalApp.jsx::defaultMemberForUser
- apps/medical/ui/MedicalApp.jsx::MedicalApp
tests: []
links: {}
notes: ''
