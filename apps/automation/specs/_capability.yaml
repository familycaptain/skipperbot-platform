scope: 'The bridge between Skipper and the household''s Home Assistant: reading what the house is
  doing right now (sensors, doors, batteries, media, climate), changing what it is doing (lights,
  switches, fans, and any other Home Assistant action), and learning the everyday names people use
  for their things so nobody has to speak in entity ids. NOT the owner of what a household member is
  allowed to do — the only limits are the ones Home Assistant''s own token enforces and the narrower
  set the app''s own screen offers. NOT prompt rules or standing behaviour (the Behaviors app), and
  NOT scheduled work (the Schedules app): this app only ever acts when someone asks it to.'
