kind: specification
id: automation.setup.credentials-are-write-only
title: The access token is entered, never read back
state: live
autonomy: gated
behavior: >
  The access token is stored encrypted and used only as the credential on requests to Home Assistant;
  it is never quoted back in an answer, a device listing, or an error. If it can no longer be read —
  the encryption key changed, the stored value is damaged — the app reports itself as not configured
  and asks for the token again, rather than failing every request with an unexplained error.
implements:
- apps/automation/tools.py::_ha_token
- apps/automation/manifest.yaml
- app_platform/settings.py::get
tests: []
links: {}
notes: ''
