kind: specification
id: locator.browsing.the-list-says-where-everything-is
title: The list says where everything is
state: live
autonomy: gated
behavior: >
  The app's list gives each thing's name, the start of its description, its place and precise spot, its
  category, its count and its first few tags, so the list can be read straight through without opening
  anything. A thing recorded without a name shows as untitled rather than as a blank row nobody can
  click with confidence.
implements:
- apps/locator/ui/LocatorListApp.jsx
- apps/locator/routes.py::api_list_located_items
tests: []
links: {}
notes: ''
