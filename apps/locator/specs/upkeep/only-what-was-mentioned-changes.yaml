kind: specification
id: locator.upkeep.only-what-was-mentioned-changes
title: Only what was mentioned changes
state: live
autonomy: gated
behavior: >
  An edit touches only the details it actually mentions and reports which ones it changed; everything
  unmentioned keeps exactly the value it had. An edit that mentions nothing at all changes nothing and
  says there was nothing to change, rather than rewriting the record with blanks.
implements:
- apps/locator/tools.py::update_located_item
- apps/locator/data.py::update_item
- apps/locator/routes.py::api_update_located_item
tests: []
links: {}
notes: ''
