scope: 'Where the household keeps its things: a person records what a physical object is and where
  it lives — room, container, precise spot, category, tags, count, photos — and can ask for it back
  later in conversation or in the app. Also owns the set of named storage places. NOT inventory,
  stock levels or shopping (the Lists app), and NOT where PEOPLE are — Locator answers ''where did we
  put it?''.'
