kind: specification
id: locator.recording.unreadable-tags-never-lose-the-item
title: Unreadable tags never lose the item
state: live
autonomy: gated
behavior: >
  When the tags offered for a NEW item cannot be made sense of, the item is still recorded — without
  tags — because where the thing is matters more than how it was labelled. Editing an existing item
  behaves the other way round: tags that cannot be read stop the edit and nothing at all changes, so a
  bad edit never silently strips labels an item already had.
implements:
- apps/locator/tools.py::create_located_item
- apps/locator/tools.py::update_located_item
tests: []
links: {}
notes: ''
