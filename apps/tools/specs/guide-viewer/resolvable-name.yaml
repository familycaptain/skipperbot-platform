kind: specification
id: tools.guide-viewer.resolvable-name
title: A category's guide is named by something that opens
state: live
autonomy: gated
behavior: >
  A category is published either with no guide at all or with a guide name that this app will then
  resolve to content — never an internal file path, and never a name it will refuse. Two different
  apps therefore offer two different guides, and a category whose guide file is missing is
  published as having none rather than as one that fails to open.
implements:
- apps/tools/routes.py::_resolvable_guide
- apps/tools/routes.py::api_tool_categories
- apps/tools/ui/ToolsApp.jsx::handleSelectCategory
tests:
- type: unit
  path: apps/tools/tests/test_tool_guide.py
  rubric: >
    With a stubbed registry containing app-declared categories — two whose guide file exists on
    disk, one whose declared guide file does not, one declaring nothing — the published guide name
    is a bare, separator-free name for the first two, distinct between them, and absent for the
    other two. No published name is an absolute path or contains a path separator.
- type: unit
  path: apps/tools/tests/test_tool_guide.py
  rubric: >
    Round trip: every non-empty guide name the catalogue publishes resolves through the guide
    request to non-empty content — no refusal, no not-found. A name declared by a routing-file
    category is existence-checked and returned exactly as declared, including its .md ending.
links: {}
notes: >
  Guide names are derived per category from that category's own identity, so the internal absolute
  guide path stays internal — it is what the prompt builder injects. The operator's fork was to
  derive a public bare name rather than teach the viewer to accept paths.
verified: true
