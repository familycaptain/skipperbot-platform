scope: >
  Four self-contained games that run entirely in the browser — Wardenfall (tower defense),
  Spinhazard (vector shooter), Aeldrift (3D exploration) and Solitaire (Klondike) — plus one
  high-score board the whole household shares. Nothing to install, no accounts, no assets to
  download and no network needed to play; only score recording and Solitaire's resume touch the
  server. NOT an online or competitive game service, and not a games launcher for anything the
  household installs itself: these are the diversions Skipper ships with.
