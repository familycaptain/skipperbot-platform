kind: specification
id: prioritize.family.only-people-appear
title: Only people appear in the household view
state: live
autonomy: gated
behavior: >
  The household view lists the people in the household. Accounts that are not people — Skipper's own,
  and any integration or service account — are left out, so nobody has to read past rows that will
  always say "no focus items set", and no such account is ever nudged about empty focus positions.
implements:
- apps/prioritize/tools.py::get_family_focus
- agent.py::api_get_family_focus
- data_layer/users.py::get_human_users
tests: []
links: {}
notes: ''
