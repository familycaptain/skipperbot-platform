kind: specification
id: prioritize.focus.promote-focus
title: Promote something into focus
state: live
autonomy: gated
behavior: >
  Promoting an item puts it in the lowest free focus position and confirms which position it took,
  naming the item rather than echoing an id. An item already in focus is left exactly where it is —
  never moved, never listed twice. Promoting requires both what kind of thing it is and which one;
  either one missing is refused, saying which was missing, and nothing is pinned.
implements:
- apps/prioritize/tools.py::promote_focus
- apps/prioritize/data.py::promote_to_focus
- apps/prioritize/ui/PrioritizeApp.jsx::BacklogItem
- agent.py::api_promote_focus
