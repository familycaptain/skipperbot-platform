kind: specification
id: documents.curation.bookkeeping-chatter-is-never-written-up
title: Bookkeeping chatter is never written up
state: live
autonomy: gated
behavior: >
  Skipper's own internal record-keeping — a task changing status, one item being linked to another, a
  notification going out, a job finishing — is discarded before a round reads anything, so no document
  is ever composed out of it and it is not re-examined on later rounds. What survives the filter is the
  kind of thing a member of the household would actually want to read: facts about people and pets,
  household knowledge, preferences, routines, vehicles, health and money.
implements:
- apps/documents/domain.py::_is_noise_memory
- apps/documents/domain.py::_NOISE_PATTERNS
- prompts/DOCUMENT_THINK.md
tests:
- type: unit
  path: apps/documents/tests/test_doc_observe_catchup_counters.py
  rubric: >
    A window containing nothing but bookkeeping chatter still advances the bookmark to the last item
    examined, so filtered-out items are never re-scanned on subsequent rounds.
- type: unit
  path: tests/platform/test_fact_extraction_and_notification_memory.py
  rubric: >
    A memory about a notification (about = n-…, tagged notification) is filtered, while a household
    fact that merely mentions notifications (a person's notification preferences) is not.
links: {}
notes: >
  2026-10-01: "a notification going out" was only caught when worded as "[created] …" or
  "notification n-…"; the facts digested from notification records ("Notification to Rodney said …
  delivery failed") got through, and the household's Folders filled with a "Notification delivery
  failures" log and dated nag snapshots. Any memory about a notification is now filtered.
