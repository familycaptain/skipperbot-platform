kind: specification
id: calculators.compound-interest.goal-already-met
title: A goal already reached is not a negative answer
state: live
autonomy: gated
behavior: >
  Asked how long, or what rate, is needed to reach a goal that is already at or below the current
  balance, the calculator says the goal has already been reached instead of reporting a negative
  number of years or a negative rate. A goal exactly equal to the balance is answered as zero — an
  ordinary result, not an error — and a goal above the balance is still solved normally. The
  sentence a person reads is the same in the app and in chat.
implements:
- apps/calculators/ui/CalculatorsApp.jsx::solveCompound
- apps/calculators/tools.py::compound_interest
tests:
- type: unit
  path: apps/calculators/tests/test_tools_compound.py
  rubric: >
    Offline. Solving for years with a goal below the balance returns the already-reached sentence with
    no minus sign anywhere in it; a goal equal to the balance returns nought years; a goal above the
    balance still returns a real positive number of years. The same three cases hold when the annual
    rate is the blank field. No exception escapes for any goal at, below or above the balance.
- type: playwright
  path: apps/calculators/tests/compound_goal_met.spec.js
  rubric: >
    Against the live web app, Calculators then the compound-interest tab. A goal below the principal
    with years left blank shows the already-reached message and no negative number anywhere on the
    result. A goal equal to the principal shows nought years. A goal above the principal shows a
    positive number of years.
links: {}
notes: ''
