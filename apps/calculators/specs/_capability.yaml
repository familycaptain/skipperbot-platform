kind: capability
id: calculators
title: Calculators
app: calculators
scope: >
  Three calculators a household can reach either by opening the app or by asking Skipper: a
  scientific calculator for a quick sum, and two finance calculators — savings growth and a loan or
  mortgage — that each solve for whichever single value is left blank and show what the money
  actually costs. Arithmetic only: nothing is stored, nothing is sent anywhere, and no result is a
  recommendation.
state: live
