kind: specification
id: auto.detail.deleting-asks-first
title: Deleting a vehicle asks first; deleting a line does not
state: live
autonomy: gated
behavior: >
  Deleting a vehicle from its screen asks for confirmation in place first, and answering no
  leaves everything exactly as it was; confirming returns to the fleet list, which no longer
  includes it. Deleting one record — a service entry, an issue, a valuation, a condition report —
  takes effect on a single action with no confirmation, because it costs one line rather than a
  vehicle's entire history.
implements:
- apps/auto/ui/AutoDetailApp.jsx
