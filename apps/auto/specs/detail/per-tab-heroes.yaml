kind: specification
id: auto.detail.per-tab-heroes
title: An empty tab explains what it is for
state: live
autonomy: gated
behavior: >
  Each tab of a vehicle's screen — upkeep, service history, issues, condition, value — explains
  what it is for and how to start when that vehicle has nothing of the kind yet, instead of a
  bare "none yet". A tab with records shows its list as normal. The explanation is held back
  until the vehicle's records have actually arrived, so it never flashes on a vehicle that does
  have them.
implements:
- apps/auto/ui/AutoDetailApp.jsx
- web/src/components/PristineEmpty.jsx
tests: []
links: {}
notes: >
  Per-tab rather than one screen-level empty state, because a vehicle commonly has plenty of
  service history and no valuations at all; the wording of each is the operator's.
