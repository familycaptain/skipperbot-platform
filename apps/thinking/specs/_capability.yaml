title: Thinking
app: thinking
scope: >
  The household's window onto Skipper's own background thought, and the switchboard for it: which
  areas of thought are allowed to run at all, what each is currently holding in mind, every pass
  it has taken and what that cost, the running record of everything said, and the work Skipper
  does on its own. This is the only place in the product where an area of background thought is
  turned on or off. NOT the thinking itself — the rhythm, budget throttling and reasoning belong
  to the platform scheduler and to the apps that own each area.
