kind: specification
id: thinking.work.where-it-left-off
title: Where it left off on each thing
state: live
autonomy: gated
behavior: >
  For each thing Skipper is working on, the screen shows the note it left itself about where it
  stopped, so a person can see a long job progressing across sessions rather than starting over
  each time.
