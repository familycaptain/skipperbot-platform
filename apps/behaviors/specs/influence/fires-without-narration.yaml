kind: specification
id: behaviors.influence.fires-without-narration
title: A rule that fires is not read back
state: live
autonomy: gated
behavior: >
  When a rule fires, the person sees its result — the item marked done, the reminder offered — not the
  rule quoted back at them or a request for permission to apply it. A standing instruction that
  announced itself every time would be more intrusive than doing the thing by hand, which is the
  opposite of why it was set up.
implements:
- chat_domain.py::_build_system_prompt
- app_platform/voice/prompting.py::build_active_behavior_rules
tests: []
