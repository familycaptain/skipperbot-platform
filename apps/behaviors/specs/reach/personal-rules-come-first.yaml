kind: specification
id: behaviors.reach.personal-rules-come-first
title: Personal rules are presented before the household's
state: live
autonomy: gated
behavior: >
  Rules are presented to Skipper with the person's own first and the household's after, and within each
  group in the order they were created. The order is stable between turns, so a set of rules that works
  today is not rearranged tomorrow, and a personal rule is the one nearer to hand when it overlaps a
  household one.
implements:
- apps/behaviors/data.py::list_behaviors
tests: []
links: {}
notes: >
  Ordering is not a resolution mechanism — overlapping rules stay ambiguous. It only ensures the
  ambiguity does not change from one turn to the next.
