kind: specification
id: platform.deploy.agent-memory-containment
title: Skipper cannot exhaust its host and take the household's other services down with it
state: live
autonomy: gated
verified: true
behavior: >
  Skipper cannot bring down the machine it shares with the household's other services. If its
  memory use runs away, Skipper is stopped and restarted on its own within a ceiling the host
  can survive, rather than being allowed to consume the machine's memory and swap until the host
  itself falls over — which on a Raspberry Pi previously tripped a hardware watchdog that
  reset the whole box. That ceiling is a true memory ceiling, not one a runaway can slip past by
  swapping to disk, and whoever runs the install can raise or lower it for their own hardware
  without editing anything Skipper ships and without the next update undoing it; an install the
  operator deliberately stopped stays stopped. Where the operating system does not enforce such
  a limit until it is switched on, the setup documentation says what to enable and how to
  confirm it is in force, so the protection is never silently absent.
implements:
- 'docker-compose.yml (services.agent): mem_limit + memswap_limit ${AGENT_MEM_LIMIT:-6g}; restart:
  unless-stopped; MALLOC_ARENA_MAX=2 in environment; a comment noting the cmdline.txt cgroup prerequisite.'
- 'docs/00-pi-hardware-and-setup.md: cgroup-memory enablement step (cmdline.txt single-line append +
  reboot + verification), placed after the swap section (folds #97).'
tests:
- type: unit
  path: tests/evolve/deploy/test_agent_memory_containment.py
  rubric: >
    Deterministic file-parse (yaml.safe_load docker-compose.yml, no container run): services.agent
    mem_limit == '${AGENT_MEM_LIMIT:-6g}' AND memswap_limit == the same (true RAM ceiling, env-overridable);
    restart == 'unless-stopped'; environment MALLOC_ARENA_MAX == '2'; a compose comment references the
    cgroup prerequisite; docs/00-pi-hardware-and-setup.md contains cgroup_enable=memory, cgroup_memory=1,
    and cmdline.txt; the db service is NOT capped.
- type: e2e
  path: (test host, validate-time)
  rubric: >
    On the test host (x86 Docker, cgroup memory enabled by default): deploy the branch and
    `docker inspect` the agent container — HostConfig.Memory == 6442450944 (6g) and
    HostConfig.MemorySwap == 6442450944 (== memory, true RAM ceiling); container is healthy.
issues:
- 96
- 97
links: {}
notes: >-
  Operator constraint: the cap is env-interpolated, never hardcoded, so a production host's
  hand-set value is not clobbered by an update. The containment is deliberately independent of any
  particular leak fix.
