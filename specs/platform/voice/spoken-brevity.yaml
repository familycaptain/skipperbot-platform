kind: specification
id: platform.voice.spoken-brevity
title: Voice responses are concise and listening-tuned
state: live
behavior: >
  Skipper gives the shortest answer possible, the way someone in the household would. A request to
  do something is done and, most of the time, confirmed in one word ("Done.") — the request is not
  repeated back, the steps are not described, and nothing Skipper looked up along the way is
  reported. A question gets just its answer. Nothing follows the answer: no offer to do more, no
  suggestion of what else it could do, no "let me know" or "I'm here to help". Skipper says
  nothing before using a tool and never repeats a request or question back; if a lookup takes a
  moment, a word or two ("Checking.") is played automatically to cover the wait. It speaks before
  acting only when it genuinely needs something from the person, or has information that differs
  from what they said. Short is
  never incomplete: a value someone asked for is said in full, a few items are said as a quick
  list, and a failure says in one sentence what went wrong. Confirmations before anything
  dangerous, expensive, irreversible or sensitive, and the identity check, are never cut. Typed
  chat is unaffected.
implements:
- app_platform/voice/prompting.py::VOICE_SHORTEST_ANSWER
- app_platform/voice/prompting.py::build_voice_brevity_rules
- app_platform/voice/prompting.py::build_voice_tool_ack_rules
- app_platform/voice/relay.py::_ACK_FILLER_INSTRUCTION
tests:
- type: unit
  path: tests/platform/test_voice_brevity.py
  rubric: 'Deterministic/offline: (1) build_voice_brevity_rules() returns a non-empty block
    whose text conveys (case-insensitive, robust intent-bearing substrings — NOT exact phrases)
    lead-with-the-answer, short/sentence, do-not-omit/offer-more, voice/aloud, and the safety
    carve-out + the no-suppress-ack note. (2) Source/AST check of app_platform/voice/prompting.py
    asserting the build_voice_brevity_rules symbol is referenced inside BOTH builders by name
    — build_base_voice_instructions AND build_app_voice_payload (reachable from each builder''s
    AST subtree; NOT keyed on a local var name or a fixed ordinal position). (3) The brevity
    guidance is NOT added to prompts/BEHAVIOR.md (voice-only). Avoid importing the full instruction
    assembly. Fails on baseline (no build_voice_brevity_rules / not wired in either builder)
    and passes after. NOTE: proves the rule is PRESENT+wired in both builders, not that the
    model is actually brief (that''s Gate-3).'
- type: acceptance
  path: 'live: voice reply length'
  rubric: 'Driving the live voice agent: (a) a prose question the model tends to over-explain
    -> reply leads with the answer, ~1-2 sentences, offers more (only if there''s genuinely
    more) instead of dumping; key info NOT dropped. (b) an ID/verbatim recall query -> the
    requested value is still spoken in full. (c) an enumerable answer (a few reminders/devices)
    -> spoken as a brief compact list, not collapsed/deferred. (d) a slow-tool query (e.g.
    weather) -> still gets its #18 pre-tool ack. (e) the same queries on web/chat stay detailed.
    Operator Gate-3 live verify.'
links: {}
notes: >
  Revised 2026-09-26 at the operator's direction, replacing the version verified earlier. That
  version required an acknowledgement spoken before any slow tool — explicitly including database
  writes — and allowed an offer to say more. Together they turned "mark the Elantra as started"
  into "OK, let me check to mark the Elantra as started. Yes, I see a task for starting the
  Elantra. Let me mark that for you. OK, the Elantra has been marked as started. If you want I can
  check other vehicles for you. Just let me know. I am here to help." The operator's standard: his
  kids would say "done". The instructions now open with "ALWAYS GIVE THE SHORTEST ANSWER
  POSSIBLE", ahead of the chat personality. The wait is covered by the relay's own
  deterministic filler (voiced only when the model called a tool silently and it is still running
  after a second), now capped at one or two words. The model was being told to speak first, and
  did so by restating the request — "Let me check the current weather for you." The acceptance rubric above predates this revision —
  in particular (a)'s "offers more" and (d)'s pre-tool ack no longer apply; re-verify live.
verified: false
