kind: specification
id: platform.onboarding.timezone-offset
title: Picking a timezone shows the offset, not just the name
state: live
autonomy: gated
behavior: >
  Choosing a timezone during first-run setup offers every timezone in the world, each labelled with
  its name and its current offset from UTC — so someone who does not recognise a zone name can still
  find the one matching their clock. The offsets shown are the ones in force today, including any
  daylight saving currently in effect, and half-hour and quarter-hour zones read exactly rather than
  being rounded. The list runs from the furthest behind UTC to the furthest ahead, and zones sharing
  an offset are ordered by name, so the same person sees the same order every time. A zone whose
  offset cannot be determined is left out rather than shown with a misleading one. The browser's own
  guess is preselected and can be overridden, and the timezone is chosen before anyone has logged in.
  Settings offers the same list from the same source, so the choice made at setup and the choice made
  later are never subtly different.
implements:
- app_platform/time.py::timezone_choices
- agent.py::GET /api/onboarding/timezones
- web/src/pages/Onboarding.jsx
tests:
- type: unit
  path: tests/test_timezone_choices.py
  rubric: >
    Every label carries a parseable UTC offset; half-hour zones keep their minutes; ordering is
    monotonic by offset then name; unresolvable zones are omitted rather than defaulted to UTC; the
    full IANA set is offered; the call never raises across the whole set.
links: {}
notes: ''
