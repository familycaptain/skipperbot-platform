kind: specification
id: platform.attention.arrival-is-answered-by-a-turn
title: Arriving is something Skipper notices
state: live
autonomy: gated
behavior: When someone opens their desktop, the arrival is recorded as owed a turn and answered by
  a real turn rather than a canned line, so the greeting reflects where things actually stood — picking
  up something outstanding, or a short hello when nothing is. If Skipper said anything to them in
  the last quarter of an hour, or they were already connected in the last quarter of an hour, it
  stays quiet, because that is a reload or a reconnect, not a return. Every household
  member is greeted, not only the person who set the system up, and the greeting turn can speak but
  cannot act on their behalf or move them around the app.
implements:
- app_platform/attention.py::_dispatch
- apps/goals/handlers.py
- agent.py
tests:
- apps/goals/tests/test_onboarding_live_greeting.py
links:
  related:
  - platform.onboarding.live-greeting
notes: >-
  The presence check (2026-09-30): a client reconnecting every minute was greeted "welcome back"
  every ~16 minutes around the clock, and those greetings pushed real conversation out of the
  20-turn scrollback. Records current behaviour. platform.onboarding.live-greeting describes the
  retired priority-event path with its greet-once claim, primary-user-only gate and client-simulated
  typing, none of which is how arrival is handled now.
