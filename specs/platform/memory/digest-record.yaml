kind: specification
id: platform.memory.digest-record
title: Memory ingestion on CRUD
state: live
autonomy: gated
behavior: Every non-read CRUD calls digest_record, ingesting the change into semantic memory (embeddings)
  so it can ground future chat — required of every app's data layer.
implements:
- app_platform/memory.py
- data_layer/memories.py
tests: []
links: {}
notes: >
  Exception (2026-10-01): notifications do not call digest_record. A notification is already one
  small, self-contained statement, and digesting it saved a second copy of every message; the
  "[created] notification" auto-memory is the record that Skipper told someone. Like the email app's
  rules (configuration, not events), this is a deliberate, tested omission.
