kind: specification
id: platform.identity.address-by-display-name
title: People are addressed by the name they chose, not the username they log in with
state: live
autonomy: gated
verified: true
behavior: >
  Wherever Skipper speaks or writes to a person — a chat reply, a proactive message, an arrival
  greeting, the household roster it reasons over, a chores message, spoken output — it addresses
  and refers to them by the name they chose to be called, never by the username they log in
  with. Someone who has set no such name is addressed by their username with the first letter
  capitalised, so the address is never blank. The login username stays how a message is TARGETED
  at a person, so asking Skipper to message someone still works by account name, and a chosen
  name that is unusually long or carries line breaks is reduced to a single trimmed name that
  cannot change how Skipper behaves.
implements:
- data_layer/users.py (display_name_for helper + input hygiene)
- config.py (get_dynamic_system_context "talking to" line)
- apps/goals/pm_domain.py (_build_user_prompt roster)
- apps/goals/handlers.py (connection greeting format)
- apps/chores/handlers.py (per-kid message block)
tests:
- type: unit
  path: tests/platform/test_address_by_display_name.py
  rubric: >
    Deterministic, DB-free (monkeypatch users.get_user): display_name_for('qa83v') -> 'Rodney'; blank/
    whitespace/missing display_name -> title-cased username; a missing user -> title-cased username;
    input hygiene collapses newlines and caps length <=64; a blank name is safe ('').
- type: e2e
  path: (test host, validate-time)
  rubric: >
    Behavioral oracle for the prose: with a primary user name='qa83v'/display_name='Rodney', the chat
    dynamic system context addresses 'Rodney' (not 'qa83v') while still naming the username for tools; the
    pm roster shows 'Rodney (username `qa83v`, primary)'. Voice-surface validation may defer to Gate-3 UAT.
