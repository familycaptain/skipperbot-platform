kind: specification
id: platform.webui.theme
title: A chosen light or dark theme covers the whole console and survives reload
state: live
autonomy: gated
behavior: >
  A control in the top-right of the web console switches between a dark and a light appearance,
  and the whole desktop changes at once — the shell and every open app panel together, with no
  half-light seam — without a reload and without disturbing what is on screen. The choice
  belongs to that browser and survives navigation and restarts: the console is already in the
  chosen theme on first paint, with no flash of the other one, the phone browser's own chrome
  matches it, and a browser that has never chosen starts dark. In both themes every piece of
  content — chat text, notifications, code blocks, tables, links, app panels — stays legible
  against whatever surface it sits on, meeting WCAG AA. A browser that refuses to remember the
  choice still switches immediately; it simply starts dark again next time.
implements:
- web/src/index.css
- web/src/utils/theme.js
- web/index.html
- web/src/main.jsx
- web/src/components/Shell.jsx
tests:
- type: acceptance
  path: scripts/p2_theme_acceptance.py
  rubric: 'Drive the LIVE web UI: (1) log in; assert the theme toggle is present top-right
    in the Shell header with an aria-label. (2) Fresh browser (no saved pref) defaults to
    dark; assert document root has no light theme and a representative shell surface AND an
    open app-panel surface both render DARK token colors. (3) Click the toggle; WITHOUT a
    reload assert document root flips to data-theme=''light'' and BOTH the shell surface and
    the app-panel surface recolor to LIGHT values (whole-desktop switch, no seam). (4) Spot-check
    contrast in light mode: assert chat-bubble text and at least one app-panel text meet AA
    (computed color vs background, >=4.5:1). (5) Reload; assert theme persists as ''light''
    with NO flash of dark before paint (data-theme already set on first paint) and the theme-color
    meta reflects light. (6) Toggle back to dark, reload; assert persisted dark. Green only
    if the whole desktop switches instantly, persists with no flash, and light mode passes
    the AA spot-check.'
links: {}
notes: >-
  App panels render in the same DOM as the shell, so a core-first partial migration would leave a
  visible light-shell/dark-panel seam; redefining Tailwind's colour variables at the document root
  recolours the whole desktop at once. Operator chose an always-dark fresh-browser default over
  honouring prefers-color-scheme.
verified: true
