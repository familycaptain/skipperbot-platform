kind: specification
id: platform.webui.chat-connection-recovery
title: A dropped console connection recovers by itself; a rejected session goes back to login
state: live
autonomy: gated
behavior: >
  When the console's live connection drops — a restart, a flaky network — it keeps retrying
  on its own and resumes without the person doing anything, and nothing said while it was
  down is lost because it is waiting in the record when they reconnect. When the connection
  is refused because the person's session is no longer valid, it stops retrying and returns
  them to the login screen, rather than leaving an apparently normal chat window that
  silently never sends or receives anything.
implements:
- web/src/hooks/useSkipperSocket.js
- connections.py
- agent.py
tests: []
links: {}
notes: ''
