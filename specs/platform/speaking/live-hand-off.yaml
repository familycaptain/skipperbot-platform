kind: specification
id: platform.speaking.live-hand-off
title: A person who is watching gets Skipper's words as soon as they are composed
state: live
autonomy: gated
behavior: >
  When a person is watching the web console at the moment Skipper finishes composing
  something for them, the words appear on their screen at once rather than after the next
  background delivery pass, which can be up to half a minute later. When they are not
  watching, nothing is lost — the utterance is already recorded and is there when they
  return. Something produced by scheduled background work while nobody is watching may
  still arrive on the next delivery pass rather than instantly; that is a delay, never a
  loss.
implements:
- app_platform/speak.py::speak
- app_platform/speak.py::deliver_now
- app_platform/speak.py::speak_sync
tests: []
links: {}
notes: ''
