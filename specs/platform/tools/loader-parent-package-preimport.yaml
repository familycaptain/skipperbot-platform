kind: specification
id: platform.tools.loader-parent-package-preimport
title: Every tool file's abilities become available, including ones that import their siblings
state: live
autonomy: gated
behavior: >
  All of Skipper's abilities are available once it has started, including those defined in a file that
  references another file in the same group. Such a file is loaded whole rather than abandoned
  part-way, so none of the abilities it defines go missing — the failure this prevents is not an error
  anyone sees, but a capability Skipper quietly no longer has, with no complaint at startup and no
  symptom until someone asks for it. Loading is repeatable: starting twice registers nothing twice,
  and a file that genuinely cannot load costs only its own abilities, not those of the files after it.
implements:
- tool_dispatch.py::_discover_legacy_tools
tests:
- type: integration
  path: tests/test_tool_loader_artifact.py
  rubric: >
    Abilities defined in a file with a sibling import are present in the registry after startup, and
    loading such a file does not fail part-way.
links: {}
notes: >
  Stated without an exact tool count on purpose: a total is a fact about today's build and would make
  this spec stale the moment an ability is added.
